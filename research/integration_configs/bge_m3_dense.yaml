experiment_id: EXP-0042-BGE-M3-DENSE
description: BGE-M3 Dense Retrieval (1024-dim dense embeddings)
feature_flags:
  ENABLE_BGE_M3: true
  ENABLE_BGE_M3_SPARSE: false
  ENABLE_QDRANT: false
  ENABLE_PYLATE: false
  ENABLE_RAGLITE: false
  ENABLE_PAGEINDEX_STRUCTURAL: false
  ENABLE_PAGEINDEX_AGENTIC: false
  ENABLE_COLSMOL: false
  ENABLE_NEO4J: false
  ENABLE_CRAG: false
  ENABLE_LLMLINGUA: false
  ENABLE_DOCLING: false
  ENABLE_MARKER: false
  ENABLE_SURYA: false
  ENABLE_LLAMA_CPP: false
  ENABLE_OLLAMA: false
  ENABLE_GEMMA3N: false
  ENABLE_BITNET: false
retriever: bge_flag
mode: dense
embedding_model: BAAI/bge-m3
embedding_dim: 1024
batch_size: 4
max_length: 512
verifier:
  name: A4
  file: backend/rag_ambiguity_guard_verifier.php
  frozen: true
  prompt: P4_neutral
  thresholds:
    entailment: 0.85
    contradiction: 0.8
dataset:
  dev: EXP-0025-DEVELOPMENT-DATASET.json
  blind: EXP-0033-BLIND-DATASET.json
blind_evaluation:
  enabled: false
