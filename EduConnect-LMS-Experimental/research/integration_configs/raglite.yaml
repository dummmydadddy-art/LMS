experiment_id: EXP-0063-RAGLITE
description: RAGLite Composite Research Path (Hybrid search and late chunking)
feature_flags:
  ENABLE_BGE_M3: false
  ENABLE_BGE_M3_SPARSE: false
  ENABLE_QDRANT: false
  ENABLE_PYLATE: false
  ENABLE_RAGLITE: true
  ENABLE_PAGEINDEX_STRUCTURAL: false
  ENABLE_PAGEINDEX_AGENTIC: false
  ENABLE_COLSMOL: false
  ENABLE_NEO4J: false
  ENABLE_CRAG: false
  ENABLE_LLMLINGUA: false
  ENABLE_DOCLING: false
  ENABLE_MARKER: false
  ENABLE_SURYA: false
  ENABLE_LLAMA_CPP: false
  ENABLE_OLLAMA: false
  ENABLE_GEMMA3N: false
